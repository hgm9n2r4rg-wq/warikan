<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの割り勘</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 18px;
    }

    .label {
      color: #555;
    }

    .amount {
      font-weight: bold;
    }

    .settlement {
      margin-top: 16px;
      padding: 14px;
      background: #eef6ff;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      color: #0066cc;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: #007aff;
      color: white;
    }

    button:active {
      background: #005fcc;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>ふたりの割り勘</h1>
    <p class="subtitle">2人の支払いをかんたんに管理します</p>

    <div class="card">
      <h2>8月の支出</h2>

      <div class="row">
        <span class="label">自分</span>
        <span class="amount" id="myTotal">¥82,400</span>
      </div>

      <div class="row">
        <span class="label">相手</span>
        <span class="amount" id="otherTotal">¥51,600</span>
      </div>

      <div class="row">
        <span class="label">差額</span>
        <span class="amount" id="difference">¥30,800</span>
      </div>

      <div class="settlement">
        <span id="settlement">相手 → 自分　¥15,400</span>
      </div>
    </div>

    <button id="addButton">＋ 支払いを追加</button>
  </div>

  <script>
    const addButton = document.getElementById("addButton");
    const myTotalElement = document.getElementById("myTotal");
    const otherTotalElement = document.getElementById("otherTotal");
    const differenceElement = document.getElementById("difference");
    const settlementElement = document.getElementById("settlement");

    let myTotal = 82400;
    let otherTotal = 51600;

    function updateScreen() {
      const difference = Math.abs(myTotal - otherTotal);
      const settlement = Math.floor(difference / 2);

      myTotalElement.textContent = `¥${myTotal.toLocaleString()}`;
      otherTotalElement.textContent = `¥${otherTotal.toLocaleString()}`;
      differenceElement.textContent = `¥${difference.toLocaleString()}`;

      if (myTotal > otherTotal) {
        settlementElement.textContent =
          `相手 → 自分　¥${settlement.toLocaleString()}`;
      } else if (otherTotal > myTotal) {
        settlementElement.textContent =
          `自分 → 相手　¥${settlement.toLocaleString()}`;
      } else {
        settlementElement.textContent = "精算はありません";
      }
    }

    addButton.addEventListener("click", function () {
      const amountText = prompt("支払った金額を入力してください");
      const amount = Number(amountText);

      if (!amountText || isNaN(amount) || amount <= 0) {
        alert("正しい金額を入力してください");
        return;
      }

      const person = prompt(
        "支払った人を入力してください\n「自分」または「相手」"
      );

      if (person === "自分") {
        myTotal += amount;
      } else if (person === "相手") {
        otherTotal += amount;
      } else {
        alert("「自分」または「相手」と入力してください");
        return;
      }

      updateScreen();
      alert("支払いを追加しました");
    });

    updateScreen();
  </script>
</body>
</html>
