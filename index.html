<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの割り勘</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f7;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0;
      font-size: 18px;
    }

    .amount {
      font-weight: bold;
      white-space: nowrap;
    }

    .settlement {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eef6ff;
      color: #0066cc;
      font-weight: bold;
      text-align: center;
      font-size: 18px;
    }

    label,
    .field-title {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    .required-star {
      margin-left: 4px;
      color: #ff3b30;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    .person-buttons,
    .split-buttons {
      display: flex;
      gap: 10px;
    }

    .person-button,
    .split-button {
      flex: 1;
      margin-top: 0;
      background: #e9e9ed;
      color: #333;
    }

    .person-button.selected,
    .split-button.selected {
      background: #007aff;
      color: white;
    }

    .cancel-button,
    .reload-button {
      background: #e9e9ed;
      color: #333;
    }

    .expense {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-main {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: bold;
    }

    .expense-detail {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .expense-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .expense-buttons button {
      margin-top: 0;
      padding: 9px;
      font-size: 14px;
    }

    .edit-button {
      background: #6c63ff;
    }

    .delete-button {
      background: #ff3b30;
    }

    .message {
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      color: #c62828;
    }

    .editing-title {
      color: #6c63ff;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>ふたりの割り勘</h1>
    <p class="subtitle">つかさとりさの支払いを管理します</p>

    <section class="card">
      <h2 id="formTitle">支払いを追加</h2>

      <form id="expenseForm">
        <label for="amount">
          金額<span class="required-star">*</span>
        </label>

        <input
          id="amount"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          min="1"
          step="1"
          placeholder="例：1200"
          required
        >

        <div class="field-title">
          支払った人<span class="required-star">*</span>
        </div>

        <div class="person-buttons">
          <button
            type="button"
            class="person-button"
            data-person="つかさ"
          >
            つかさ
          </button>

          <button
            type="button"
            class="person-button"
            data-person="りさ"
          >
            りさ
          </button>
        </div>

        <p id="paidByError" class="error"></p>

        <div class="field-title">
          割り勘対象<span class="required-star">*</span>
        </div>

        <div class="split-buttons">
          <button
            type="button"
            class="split-button selected"
            data-member="つかさ"
          >
            つかさ
          </button>

          <button
            type="button"
            class="split-button selected"
            data-member="りさ"
          >
            りさ
          </button>
        </div>

        <p id="splitError" class="error"></p>

        <label for="category">カテゴリ</label>

        <select id="category">
          <option value="食費">食費</option>
          <option value="外食">外食</option>
          <option value="生活用品">生活用品</option>
          <option value="家具">家具</option>
          <option value="旅行">旅行</option>
          <option value="その他">その他</option>
        </select>

        <label for="expenseDate">
          日付<span class="required-star">*</span>
        </label>

        <input id="expenseDate" type="date" required>

        <label for="memo">メモ（任意）</label>

        <textarea
          id="memo"
          placeholder="例：スーパーで買い物"
        ></textarea>

        <button id="saveButton" type="submit">
          支払いを保存する
        </button>

        <button
          id="cancelButton"
          class="cancel-button"
          type="button"
          hidden
        >
          編集をキャンセル
        </button>
      </form>
    </section>

    <section class="card">
      <h2 id="totalTitle">累計の支出</h2>

      <div class="row">
        <span>2人が払った合計金額</span>
        <span class="amount" id="totalPaid">¥0</span>
      </div>

      <div class="settlement" id="settlement">
        精算はありません
      </div>
    </section>

    <section class="card">
      <h2>支払い履歴</h2>

      <div id="history">
        <p class="message">読み込み中です…</p>
      </div>
    </section>

    <button id="reloadButton" class="reload-button" type="button">
      ↻ 最新のデータを読み込む
    </button>

    <p id="status" class="message">
      データを読み込み中です…
    </p>
  </main>

  <script>
    var SUPABASE_URL =
      "https://xecnmugjikwregzbcswy.supabase.co";

    var SUPABASE_KEY =
      "sb_publishable_kIn_cHvDOOeyMOqnQ825bg_YYt_Vlwi";

    var ROOM_CODE = "warikan-blue-7391";

    var expenses = [];
    var editingId = null;
    var selectedPayer = "";
    var selectedMembers = ["つかさ", "りさ"];

    var form = document.getElementById("expenseForm");
    var formTitle = document.getElementById("formTitle");
    var saveButton = document.getElementById("saveButton");
    var cancelButton = document.getElementById("cancelButton");
    var reloadButton = document.getElementById("reloadButton");

    var amountInput = document.getElementById("amount");
    var categoryInput = document.getElementById("category");
    var dateInput = document.getElementById("expenseDate");
    var memoInput = document.getElementById("memo");

    var historyBox = document.getElementById("history");
    var statusBox = document.getElementById("status");
    var paidByError = document.getElementById("paidByError");
    var splitError = document.getElementById("splitError");

    function todayText() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, "0");
      var day = String(now.getDate()).padStart(2, "0");

      return year + "-" + month + "-" + day;
    }

    function yen(value) {
      return "¥" + Number(value).toLocaleString("ja-JP");
    }

    function setStatus(text, isError) {
      statusBox.textContent = text;
      statusBox.className = isError
        ? "message error"
        : "message";
    }

    function updatePayerButtons() {
      document.querySelectorAll(".person-button").forEach(function(button) {
        button.classList.toggle(
          "selected",
          button.dataset.person === selectedPayer
        );
      });
    }

    function updateMemberButtons() {
      document.querySelectorAll(".split-button").forEach(function(button) {
        button.classList.toggle(
          "selected",
          selectedMembers.indexOf(button.dataset.member) !== -1
        );
      });
    }

    document.querySelectorAll(".person-button").forEach(function(button) {
      button.addEventListener("click", function() {
        selectedPayer = button.dataset.person;
        paidByError.textContent = "";
        updatePayerButtons();
      });
    });

    document.querySelectorAll(".split-button").forEach(function(button) {
      button.addEventListener("click", function() {
        var member = button.dataset.member;
        var index = selectedMembers.indexOf(member);

        if (index === -1) {
          selectedMembers.push(member);
        } else {
          selectedMembers.splice(index, 1);
        }

        splitError.textContent = "";
        updateMemberButtons();
      });
    });

    function updateSummary() {
      var totalPaid = 0;

      var tsukasaPaid = 0;
      var risaPaid = 0;

      var tsukasaShare = 0;
      var risaShare = 0;

      expenses.forEach(function(expense) {
        var amount = Number(expense.amount);

        totalPaid += amount;

        if (expense.paid_by === "つかさ") {
          tsukasaPaid += amount;
        }

        if (expense.paid_by === "りさ") {
          risaPaid += amount;
        }

        var members = Array.isArray(expense.split_members)
          ? expense.split_members
          : ["つかさ", "りさ"];

        var share = amount / members.length;

        if (members.indexOf("つかさ") !== -1) {
          tsukasaShare += share;
        }

        if (members.indexOf("りさ") !== -1) {
          risaShare += share;
        }
      });

      var tsukasaBalance = tsukasaPaid - tsukasaShare;
      var risaBalance = risaPaid - risaShare;
      var settlement = Math.round(Math.abs(tsukasaBalance));

      document.getElementById("totalPaid").textContent =
        yen(totalPaid);

      if (tsukasaBalance > 0.5) {
        document.getElementById("settlement").textContent =
          "精算：りさ → つかさ　" + yen(settlement);
      } else if (risaBalance > 0.5) {
        document.getElementById("settlement").textContent =
          "精算：つかさ → りさ　" + yen(settlement);
      } else {
        document.getElementById("settlement").textContent =
          "精算はありません";
      }

      document.getElementById("totalTitle").textContent =
        "累計の支出";
    }

    function updateHistory() {
      historyBox.innerHTML = "";

      if (expenses.length === 0) {
        var empty = document.createElement("p");
        empty.className = "message";
        empty.textContent = "支払い履歴はありません";
        historyBox.appendChild(empty);
        return;
      }

      expenses.forEach(function(expense) {
        var item = document.createElement("div");
        item.className = "expense";

        var main = document.createElement("div");
        main.className = "expense-main";

        var left = document.createElement("span");
        left.textContent =
          expense.category + "・" + expense.paid_by;

        var right = document.createElement("span");
        right.textContent = yen(expense.amount);

        var detail = document.createElement("div");
        detail.className = "expense-detail";

        var members = Array.isArray(expense.split_members)
          ? expense.split_members.join("・")
          : "つかさ・りさ";

        detail.textContent =
          expense.expense_date +
          "　割り勘対象：" + members +
          (expense.memo ? "　・" + expense.memo : "");

        var buttons = document.createElement("div");
        buttons.className = "expense-buttons";

        var editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-button";
        editButton.textContent = "編集";

        editButton.addEventListener("click", function() {
          startEdit(expense.id);
        });

        var deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "削除";

        deleteButton.addEventListener("click", function() {
          deleteExpense(expense.id);
        });

        main.appendChild(left);
        main.appendChild(right);

        buttons.appendChild(editButton);
        buttons.appendChild(deleteButton);

        item.appendChild(main);
        item.appendChild(detail);
        item.appendChild(buttons);

        historyBox.appendChild(item);
      });
    }

    function fetchWithTimeout(url, options) {
      return Promise.race([
        fetch(url, options),
        new Promise(function(_, reject) {
          setTimeout(function() {
            reject(new Error("通信がタイムアウトしました"));
          }, 12000);
        })
      ]);
    }

    async function loadExpenses() {
      setStatus("共有データを読み込んでいます…", false);

      historyBox.innerHTML =
        '<p class="message">読み込み中です…</p>';

      try {
        var url =
          SUPABASE_URL +
          "/rest/v1/expenses" +
          "?room_code=eq." + encodeURIComponent(ROOM_CODE) +
          "&select=id,amount,paid_by,category,expense_date,memo,split_members,created_at" +
          "&order=expense_date.desc,created_at.desc";

        var response = await fetchWithTimeout(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!response.ok) {
          throw new Error("読み込みエラー " + response.status);
        }

        expenses = await response.json();

        updateSummary();
        updateHistory();

        setStatus(
          "共有データ：" + expenses.length + "件",
          false
        );
      } catch (error) {
        historyBox.innerHTML =
          '<p class="message error">履歴を読み込めませんでした</p>';

        setStatus(error.message, true);
      }
    }

    function startEdit(id) {
      var expense = expenses.find(function(item) {
        return String(item.id) === String(id);
      });

      if (!expense) {
        alert("編集するデータが見つかりません");
        return;
      }

      editingId = expense.id;
      selectedPayer = expense.paid_by;

      selectedMembers = Array.isArray(expense.split_members)
        ? expense.split_members.slice()
        : ["つかさ", "りさ"];

      amountInput.value = expense.amount;
      categoryInput.value = expense.category;
      dateInput.value = expense.expense_date;
      memoInput.value = expense.memo || "";

      formTitle.textContent = "支払いを編集";
      formTitle.className = "editing-title";
      saveButton.textContent = "変更を保存する";
      cancelButton.hidden = false;

      updatePayerButtons();
      updateMemberButtons();

      amountInput.focus();
      window.scrollTo(0, 0);
    }

    function cancelEdit() {
      editingId = null;
      selectedPayer = "";
      selectedMembers = ["つかさ", "りさ"];

      form.reset();
      dateInput.value = todayText();

      formTitle.textContent = "支払いを追加";
      formTitle.className = "";
      saveButton.textContent = "支払いを保存する";
      cancelButton.hidden = true;

      paidByError.textContent = "";
      splitError.textContent = "";

      updatePayerButtons();
      updateMemberButtons();
    }

    async function saveExpense(event) {
      event.preventDefault();

      var amount = Number(amountInput.value);

      paidByError.textContent = "";
      splitError.textContent = "";

      if (!Number.isInteger(amount) || amount <= 0) {
        alert("1円以上の整数を入力してください");
        amountInput.focus();
        return;
      }

      if (!selectedPayer) {
        paidByError.textContent =
          "支払った人を選択してください";
        return;
      }

      if (selectedMembers.length === 0) {
        splitError.textContent =
          "割り勘対象を1人以上選択してください";
        return;
      }

      if (!dateInput.value) {
        alert("日付を入力してください");
        return;
      }

      saveButton.disabled = true;
      cancelButton.disabled = true;
      saveButton.textContent = "保存中…";

      try {
        var url;
        var method;
        var body;

        if (editingId === null) {
          url = SUPABASE_URL + "/rest/v1/expenses";
          method = "POST";

          body = {
            room_code: ROOM_CODE,
            amount: amount,
            paid_by: selectedPayer,
            category: categoryInput.value,
            expense_date: dateInput.value,
            memo: memoInput.value.trim() || null,
            split_members: selectedMembers
          };
        } else {
          url =
            SUPABASE_URL +
            "/rest/v1/expenses" +
            "?id=eq." + encodeURIComponent(editingId) +
            "&room_code=eq." + encodeURIComponent(ROOM_CODE);

          method = "PATCH";

          body = {
            amount: amount,
            paid_by: selectedPayer,
            category: categoryInput.value,
            expense_date: dateInput.value,
            memo: memoInput.value.trim() || null,
            split_members: selectedMembers
          };
        }

        var response = await fetchWithTimeout(url, {
          method: method,
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          var errorText = await response.text();
          throw new Error(
            "保存エラー " + response.status + " " + errorText
          );
        }

        alert(
          editingId === null
            ? "支払いを保存しました"
            : "支払いを更新しました"
        );

        cancelEdit();
        await loadExpenses();
      } catch (error) {
        setStatus(error.message, true);
        alert("保存できませんでした。画面下の表示を確認してください。");
      }

      saveButton.disabled = false;
      cancelButton.disabled = false;
    }

    async function deleteExpense(id) {
      if (!confirm("この支払いを削除しますか？")) {
        return;
      }

      try {
        var url =
          SUPABASE_URL +
          "/rest/v1/expenses" +
          "?id=eq." + encodeURIComponent(id) +
          "&room_code=eq." + encodeURIComponent(ROOM_CODE);

        var response = await fetchWithTimeout(url, {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Prefer": "return=representation"
          }
        });

        if (!response.ok) {
          throw new Error("削除エラー " + response.status);
        }

        if (String(editingId) === String(id)) {
          cancelEdit();
        }

        await loadExpenses();
        alert("支払いを削除しました");
      } catch (error) {
        setStatus(error.message, true);
        alert("削除できませんでした");
      }
    }

    form.addEventListener("submit", saveExpense);
    cancelButton.addEventListener("click", cancelEdit);
    reloadButton.addEventListener("click", loadExpenses);

    dateInput.value = todayText();
    updatePayerButtons();
    updateMemberButtons();
    loadExpenses();
  </script>
</body>
</html>
