<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの割り勘</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 18px;
    }

    .label {
      color: #555;
    }

    .amount {
      font-weight: bold;
    }

    .settlement {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eef6ff;
      color: #0066cc;
      font-weight: bold;
      text-align: center;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #007aff;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .sub-button {
      margin-top: 0;
      background: #e9e9ed;
      color: #333;
    }

    .status {
      color: #666;
      font-size: 14px;
      text-align: center;
    }

    .expense {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .expense-detail {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    .empty {
      color: #777;
      text-align: center;
    }

    .note {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>ふたりの割り勘</h1>
    <p class="subtitle">2人の支払いをかんたんに管理します</p>

    <div class="card">
      <h2 id="monthTitle">今月の支出</h2>

      <div class="row">
        <span class="label">自分</span>
        <span class="amount" id="myTotal">¥0</span>
      </div>

      <div class="row">
        <span class="label">相手</span>
        <span class="amount" id="otherTotal">¥0</span>
      </div>

      <div class="row">
        <span class="label">差額</span>
        <span class="amount" id="difference">¥0</span>
      </div>

      <div class="settlement">
        <span id="settlement">精算はありません</span>
      </div>
    </div>

    <div class="card">
      <h2>支払いを追加</h2>

      <form id="expenseForm">
        <label for="amount">金額</label>
        <input
          id="amount"
          type="number"
          min="1"
          step="1"
          placeholder="例：1200"
          required
        >

        <label for="paidBy">支払った人</label>
        <select id="paidBy" required>
          <option value="自分">自分</option>
          <option value="相手">相手</option>
        </select>

        <label for="category">カテゴリ</label>
        <select id="category">
          <option value="食費">食費</option>
          <option value="外食">外食</option>
          <option value="生活用品">生活用品</option>
          <option value="家具">家具</option>
          <option value="旅行">旅行</option>
          <option value="その他" selected>その他</option>
        </select>

        <label for="expenseDate">日付</label>
        <input id="expenseDate" type="date" required>

        <label for="memo">メモ（任意）</label>
        <textarea id="memo" placeholder="例：スーパーで買い物"></textarea>

        <button id="saveButton" type="submit">
          支払いを保存する
        </button>
      </form>
    </div>

    <div class="card">
      <h2>支払い履歴</h2>
      <div id="history">
        <p class="empty">読み込み中です…</p>
      </div>
    </div>

    <button id="reloadButton" class="sub-button">
      ↻ 最新のデータを読み込む
    </button>

    <p class="status" id="status">データを読み込み中です…</p>

    <p class="note">
      支払いデータは2人で共有されます。
    </p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://xecnmugjikwregzbcswy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_kIn_cHvDOOeyMOqnQ825bg_YYt_Vlwi";

    const ROOM_CODE = "warikan-blue-7391";

    const expenseForm = document.getElementById("expenseForm");
    const saveButton = document.getElementById("saveButton");
    const reloadButton = document.getElementById("reloadButton");

    const amountInput = document.getElementById("amount");
    const paidByInput = document.getElementById("paidBy");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("expenseDate");
    const memoInput = document.getElementById("memo");

    const myTotalElement = document.getElementById("myTotal");
    const otherTotalElement = document.getElementById("otherTotal");
    const differenceElement = document.getElementById("difference");
    const settlementElement = document.getElementById("settlement");
    const historyElement = document.getElementById("history");
    const statusElement = document.getElementById("status");
    const monthTitleElement = document.getElementById("monthTitle");

    let expenses = [];

    function getToday() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatYen(number) {
      return `¥${Number(number).toLocaleString()}`;
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isThisMonth(dateText) {
      const today = new Date();
      const prefix =
        `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

      return String(dateText).startsWith(prefix);
    }

    function updateSummary() {
      const thisMonthExpenses = expenses.filter(expense =>
        isThisMonth(expense.expense_date)
      );

      let myTotal = 0;
      let otherTotal = 0;

      for (const expense of thisMonthExpenses) {
        if (expense.paid_by === "自分") {
          myTotal += Number(expense.amount);
        } else if (expense.paid_by === "相手") {
          otherTotal += Number(expense.amount);
        }
      }

      const difference = Math.abs(myTotal - otherTotal);
      const settlement = Math.floor(difference / 2);

      myTotalElement.textContent = formatYen(myTotal);
      otherTotalElement.textContent = formatYen(otherTotal);
      differenceElement.textContent = formatYen(difference);

      if (myTotal > otherTotal) {
        settlementElement.textContent =
          `相手 → 自分　${formatYen(settlement)}`;
      } else if (otherTotal > myTotal) {
        settlementElement.textContent =
          `自分 → 相手　${formatYen(settlement)}`;
      } else {
        settlementElement.textContent = "精算はありません";
      }

      const now = new Date();
      monthTitleElement.textContent =
        `${now.getMonth() + 1}月の支出`;
    }

    function updateHistory() {
      if (expenses.length === 0) {
        historyElement.innerHTML =
          '<p class="empty">支払い履歴はありません</p>';
        return;
      }

      historyElement.innerHTML = expenses.map(expense => {
        const memo = expense.memo
          ? `・${escapeHtml(expense.memo)}`
          : "";

        return `
          <div class="expense">
            <div class="expense-top">
              <span>${escapeHtml(expense.category)}・${escapeHtml(expense.paid_by)}</span>
              <span>${formatYen(expense.amount)}</span>
            </div>
            <div class="expense-detail">
              ${escapeHtml(expense.expense_date)} ${memo}
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadExpenses() {
      statusElement.textContent = "データを読み込み中です…";

      try {
        const url =
          `${SUPABASE_URL}/rest/v1/expenses` +
          `?room_code=eq.${encodeURIComponent(ROOM_CODE)}` +
          `&select=id,amount,paid_by,category,expense_date,memo,created_at` +
          `&order=expense_date.desc,created_at.desc`;

        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error("読み込み失敗");
        }

        expenses = await response.json();

        updateSummary();
        updateHistory();

        statusElement.textContent =
          `共有データ：${expenses.length}件`;
      } catch (error) {
        console.error(error);
        statusElement.textContent =
          "読み込めませんでした。通信状態を確認してください。";
        historyElement.innerHTML =
          '<p class="empty">履歴を読み込めませんでした</p>';
      }
    }

    async function saveExpense(event) {
      event.preventDefault();

      const amount = Number(amountInput.value);

      if (!Number.isInteger(amount) || amount <= 0) {
        alert("金額は1円以上の整数で入力してください");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "保存中…";
      statusElement.textContent = "Supabaseに保存中です…";

      try {
