<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの割り勘</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f7;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 18px;
    }

    .amount {
      font-weight: bold;
    }

    .settlement {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eef6ff;
      color: #0066cc;
      font-weight: bold;
      text-align: center;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #007aff;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    .reload {
      margin-top: 0;
      background: #e9e9ed;
      color: #333;
    }

    .expense {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .expense-main {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: bold;
    }

    .expense-detail {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    .message {
      color: #666;
      text-align: center;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>ふたりの割り勘</h1>
    <p class="subtitle">2人の支払いをかんたんに管理します</p>

    <section class="card">
      <h2 id="monthTitle">今月の支出</h2>

      <div class="row">
        <span>自分</span>
        <span class="amount" id="myTotal">¥0</span>
      </div>

      <div class="row">
        <span>相手</span>
        <span class="amount" id="otherTotal">¥0</span>
      </div>

      <div class="row">
        <span>差額</span>
        <span class="amount" id="difference">¥0</span>
      </div>

      <div class="settlement" id="settlement">
        精算はありません
      </div>
    </section>

    <section class="card">
      <h2>支払いを追加</h2>

      <form id="expenseForm">
        <label for="amount">金額</label>
        <input id="amount" type="number" min="1" step="1" required>

        <label for="paidBy">支払った人</label>
        <select id="paidBy">
          <option value="自分">自分</option>
          <option value="相手">相手</option>
        </select>

        <label for="category">カテゴリ</label>
        <select id="category">
          <option value="食費">食費</option>
          <option value="外食">外食</option>
          <option value="生活用品">生活用品</option>
          <option value="家具">家具</option>
          <option value="旅行">旅行</option>
          <option value="その他">その他</option>
        </select>

        <label for="expenseDate">日付</label>
        <input id="expenseDate" type="date" required>

        <label for="memo">メモ（任意）</label>
        <textarea id="memo"></textarea>

        <button id="saveButton" type="submit">
          支払いを保存する
        </button>
      </form>
    </section>

    <section class="card">
      <h2>支払い履歴</h2>
      <div id="history">
        <p class="message">JavaScriptを起動しています…</p>
      </div>
    </section>

    <button id="reloadButton" class="reload" type="button">
      ↻ 最新のデータを読み込む
    </button>

    <p id="status" class="message">
      JavaScriptを起動しています…
    </p>
  </main>

  <script>
    var SUPABASE_URL =
      "https://xecnmugjikwregzbcswy.supabase.co";

    var SUPABASE_KEY =
      "sb_publishable_kIn_cHvDOOeyMOqnQ825bg_YYt_Vlwi";

    var ROOM_CODE = "warikan-blue-7391";
    var expenses = [];

    var form = document.getElementById("expenseForm");
    var saveButton = document.getElementById("saveButton");
    var reloadButton = document.getElementById("reloadButton");
    var amountInput = document.getElementById("amount");
    var paidByInput = document.getElementById("paidBy");
    var categoryInput = document.getElementById("category");
    var dateInput = document.getElementById("expenseDate");
    var memoInput = document.getElementById("memo");
    var historyBox = document.getElementById("history");
    var statusBox = document.getElementById("status");

    function todayText() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, "0");
      var day = String(now.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function monthPrefix() {
      var now = new Date();
      var year = now.getFullYear();
      var month = String(now.getMonth() + 1).padStart(2, "0");
      return year + "-" + month;
    }

    function yen(value) {
      return "¥" + Number(value).toLocaleString("ja-JP");
    }

    function setStatus(text, isError) {
      statusBox.textContent = text;
      statusBox.className = isError ? "message error" : "message";
    }

    function updateSummary() {
      var myTotal = 0;
      var otherTotal = 0;
      var prefix = monthPrefix();

      expenses.forEach(function (expense) {
        if (String(expense.expense_date).indexOf(prefix) !== 0) {
          return;
        }

        if (expense.paid_by === "自分") {
          myTotal += Number(expense.amount);
        }

        if (expense.paid_by === "相手") {
          otherTotal += Number(expense.amount);
        }
      });

      var difference = Math.abs(myTotal - otherTotal);
      var settlement = Math.floor(difference / 2);

      document.getElementById("myTotal").textContent = yen(myTotal);
      document.getElementById("otherTotal").textContent = yen(otherTotal);
      document.getElementById("difference").textContent = yen(difference);

      if (myTotal > otherTotal) {
        document.getElementById("settlement").textContent =
          "相手 → 自分　" + yen(settlement);
      } else if (otherTotal > myTotal) {
        document.getElementById("settlement").textContent =
          "自分 → 相手　" + yen(settlement);
      } else {
        document.getElementById("settlement").textContent =
          "精算はありません";
      }

      document.getElementById("monthTitle").textContent =
        (new Date().getMonth() + 1) + "月の支出";
    }

    function updateHistory() {
      historyBox.innerHTML = "";

      if (expenses.length === 0) {
        var empty = document.createElement("p");
        empty.className = "message";
        empty.textContent = "支払い履歴はありません";
        historyBox.appendChild(empty);
        return;
      }

      expenses.forEach(function (expense) {
        var item = document.createElement("div");
        item.className = "expense";

        var main = document.createElement("div");
        main.className = "expense-main";

        var left = document.createElement("span");
        left.textContent =
          expense.category + "・" + expense.paid_by;

        var right = document.createElement("span");
        right.textContent = yen(expense.amount);

        var detail = document.createElement("div");
        detail.className = "expense-detail";
        detail.textContent =
          expense.expense_date +
          (expense.memo ? "・" + expense.memo : "");

        main.appendChild(left);
        main.appendChild(right);
        item.appendChild(main);
        item.appendChild(detail);
        historyBox.appendChild(item);
      });
    }

    function fetchWithTimeout(url, options) {
      return Promise.race([
        fetch(url, options),
        new Promise(function (_, reject) {
          setTimeout(function () {
            reject(new Error("通信がタイムアウトしました"));
          }, 12000);
        })
      ]);
    }

    async function loadExpenses() {
      setStatus("共有データを読み込んでいます…", false);
      historyBox.innerHTML =
        '<p class="message">読み込み中です…</p>';

      try {
        var url =
          SUPABASE_URL +
          "/rest/v1/expenses" +
          "?room_code=eq." + encodeURIComponent(ROOM_CODE) +
          "&select=id,amount,paid_by,category,expense_date,memo,created_at" +
          "&order=expense_date.desc,created_at.desc";

        var response = await fetchWithTimeout(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!response.ok) {
          var errorBody = await response.text();
          throw new Error(
            "読み込みエラー " + response.status + " " + errorBody
          );
        }

        expenses = await response.json();
        updateSummary();
        updateHistory();
        setStatus("共有データ：" + expenses.length + "件", false);
      } catch (error) {
        historyBox.innerHTML =
          '<p class="message error">履歴を読み込めませんでした</p>';
        setStatus(error.message, true);
      }
    }

    async function saveExpense(event) {
      event.preventDefault();

      var amount = Number(amountInput.value);

      if (!Number.isInteger(amount) || amount <= 0) {
        alert("1円以上の整数を入力してください");
        return;
      }

      if (!dateInput.value) {
        alert("日付を入力してください");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "保存中…";
      setStatus("支払いを保存しています…", false);

      try {
        var response = await fetchWithTimeout(
          SUPABASE_URL + "/rest/v1/expenses",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify({
              room_code: ROOM_CODE,
              amount: amount,
              paid_by: paidByInput.value,
              category: categoryInput.value,
              expense_date: dateInput.value,
              memo: memoInput.value.trim() || null
            })
          }
        );

        if (!response.ok) {
          var errorBody = await response.text();
          throw new Error(
            "保存エラー " + response.status + " " + errorBody
          );
        }

        form.reset();
        dateInput.value = todayText();
        await loadExpenses();
        alert("支払いを保存しました");
      } catch (error) {
        setStatus(error.message, true);
        alert("保存できませんでした。画面下のエラーを確認してください。");
      }

      saveButton.disabled = false;
      saveButton.textContent = "支払いを保存する";
    }

    dateInput.value = todayText();
    setStatus("JavaScriptは正常に起動しました", false);

    form.addEventListener("submit", saveExpense);
    reloadButton.addEventListener("click", loadExpenses);

    loadExpenses();
  </script>
</body>
</html>
